# Excubitor catalog 断片 — このリポ自身のサービス定義。
# 公開 Excubitor リポの services.yaml に private 定義を焼き込まないため、
# 各サービスの catalog エントリは自リポに置く。 Excubitor が ${ARS_ROOT} 配下を
# 走査して集積する (Excubitor catalog/FRAGMENTS.md 参照)。
services:
  - code: calliope
    name: Calliope (planning orchestrator)
    tier: personal
    project_code: calliope
    component: backend
    port: 8891
    depends_on:
      - actio
      - schedula
      - memoria-server
    repo: LUDIARS/Calliope
    runtime: node
    cwd: ${ARS_ROOT}/Calliope
    command: npm run start
    env:
      CALLIOPE_PORT: "8891"
      ACTIO_BASE_URL: http://127.0.0.1:3000
      SCHEDULA_BASE_URL: http://127.0.0.1:3300
      MEMORIA_BASE_URL: http://127.0.0.1:5180
      # サービスマップの同期元 (稼働状態と catalog の正本)。
      # 認可は Cloudflare Access の三層 (public/ルート/admin) が正で、
      # CALLIOPE_SERVICEMAP_ADMIN_TOKEN は秘密のため catalog には書かない。
      EXCUBITOR_BASE_URL: http://127.0.0.1:17332
    autostart: false
    health:
      type: http
      url: http://localhost:8891/health
      interval_sec: 30
    provides:
      CALLIOPE_URL: http://${host}:${port}
